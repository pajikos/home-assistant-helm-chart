name: Lint and Test Charts

on: pull_request

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v4.2.4

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.8.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --target-branch ${{ github.event.repository.default_branch }} --check-version-increment=false

      - name: Run helm unittest
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest --version v1.1.2 --verify=false
          helm unittest charts/home-assistant

      - name: Run init-script tests
        if: steps.list-changed.outputs.changed == 'true'
        run: tests/init-script/test.sh
      - name: Test ServiceMonitor
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          helm template home-assistant charts/home-assistant --namespace home-assistant -f charts/home-assistant/ci/service-monitor-auth.yaml > /tmp/service-monitor-auth.yaml
          grep -q 'namespace: monitoring' /tmp/service-monitor-auth.yaml
          grep -q '      - home-assistant' /tmp/service-monitor-auth.yaml
          grep -q 'requires_auth: true' /tmp/service-monitor-auth.yaml
          grep -q 'bearerTokenSecret:' /tmp/service-monitor-auth.yaml

          helm template home-assistant charts/home-assistant --namespace home-assistant -f charts/home-assistant/ci/service-monitor-no-auth.yaml > /tmp/service-monitor-no-auth.yaml
          grep -q 'namespace: monitoring' /tmp/service-monitor-no-auth.yaml
          grep -q '      - home-assistant' /tmp/service-monitor-no-auth.yaml
          grep -q 'requires_auth: false' /tmp/service-monitor-no-auth.yaml

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.14.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct install --target-branch ${{ github.event.repository.default_branch }}

      # Add explicit test for invalid configuration
      - name: Test invalid ingress configuration
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          if helm template . --set ingress.enabled=true,ingress.external=true > /dev/null 2>&1; then
            echo "Error: Template validation should have failed when both ingress types are enabled"
            exit 1
          else
            echo "Successfully caught invalid ingress configuration"
          fi


